<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Media Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        video, audio {
            width: 100%;
            max-height: 400px;
            background-color: #000;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        input[type="file"] {
            margin-bottom: 15px;
        }
        .segment-controls {
            background-color: #3d3d3d;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
        }
        .segment-controls input[type="number"] {
            width: 60px;
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #555;
            background: #2d2d2d;
            color: white;
        }
        .playlist-container {
            margin-top: 20px;
        }
        .playlist {
            list-style: none;
            padding: 0;
            max-height: 200px;
            overflow-y: auto;
            background: #3d3d3d;
            border-radius: 5px;
        }
        .playlist li {
            padding: 10px;
            border-bottom: 1px solid #444;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
        }
        .playlist li:hover { background-color: #4d4d4d; }
        .playlist li.active { background-color: #007bff; font-weight: bold; }
        .note { font-size: 0.85em; color: #aaa; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Media Player</h2>
    <p class="note">Upload files to add them to your session playlist. (Note: Browsers cannot permanently save file paths after you close the tab for security reasons, but they will stay here while the page is open).</p>
    
    <input type="file" id="fileInput" multiple accept="video/*, audio/*">
    
    <video id="mediaPlayer" controls playsinline>
        Your browser does not support the video tag.
    </video>

    <div class="controls">
        <button id="prevBtn" disabled>⏮ Previous</button>
        <button id="nextBtn" disabled>⏭ Next</button>
        <label>
            <input type="checkbox" id="autoplayCheck" checked> Autoplay Next
        </label>
    </div>

    <div class="segment-controls">
        <strong>Custom Segment:</strong>
        <label>Start (sec): <input type="number" id="startTime" min="0" step="1"></label>
        <label>End (sec): <input type="number" id="endTime" min="0" step="1"></label>
        <label>
            <input type="checkbox" id="loopSegmentCheck"> Loop Segment
        </label>
    </div>

    <div class="playlist-container">
        <h3>Playlist</h3>
        <ul class="playlist" id="playlist"></ul>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const mediaPlayer = document.getElementById('mediaPlayer');
    const playlistEl = document.getElementById('playlist');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const autoplayCheck = document.getElementById('autoplayCheck');
    
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const loopSegmentCheck = document.getElementById('loopSegmentCheck');

    let playlist = [];
    let currentIndex = -1;

    // Handle File Uploads
    fileInput.addEventListener('change', (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        const startIndex = playlist.length;
        playlist = playlist.concat(files);
        
        renderPlaylist();

        // If nothing is playing, play the first newly added file
        if (currentIndex === -1) {
            loadMedia(startIndex);
        }
        
        updateButtons();
        // Reset file input so you can upload the same file again if desired
        fileInput.value = ''; 
    });

    // Render Playlist UI
    function renderPlaylist() {
        playlistEl.innerHTML = '';
        playlist.forEach((file, index) => {
            const li = document.createElement('li');
            li.textContent = file.name;
            if (index === currentIndex) {
                li.classList.add('active');
            }
            li.addEventListener('click', () => loadMedia(index));
            playlistEl.appendChild(li);
        });
    }

    // Load Media by Index
    function loadMedia(index) {
        if (index < 0 || index >= playlist.length) return;
        
        currentIndex = index;
        const file = playlist[index];
        
        // Create an object URL to play local files without a server
        const fileURL = URL.createObjectURL(file);
        
        mediaPlayer.src = fileURL;
        mediaPlayer.play();
        
        // Reset segment controls on new track
        startTimeInput.value = '';
        endTimeInput.value = '';
        loopSegmentCheck.checked = false;

        renderPlaylist();
        updateButtons();
    }

    // Update Next/Prev Button States
    function updateButtons() {
        prevBtn.disabled = currentIndex <= 0;
        nextBtn.disabled = currentIndex >= playlist.length - 1;
    }

    // Next / Prev Actions
    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) loadMedia(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < playlist.length - 1) loadMedia(currentIndex + 1);
    });

    // Autoplay functionality
    mediaPlayer.addEventListener('ended', () => {
        if (autoplayCheck.checked && currentIndex < playlist.length - 1) {
            loadMedia(currentIndex + 1);
        }
    });

    // Custom Start/End Position & Looping Logic
    mediaPlayer.addEventListener('timeupdate', () => {
        if (!loopSegmentCheck.checked) return;

        const startTime = parseFloat(startTimeInput.value) || 0;
        const endTime = parseFloat(endTimeInput.value) || mediaPlayer.duration;

        // If the current time hits or passes the end time, loop back to start
        if (mediaPlayer.currentTime >= endTime && endTime > startTime) {
            mediaPlayer.currentTime = startTime;
            mediaPlayer.play();
        }
    });

    // Ensure we start playing at the custom start time when the user clicks 'Play'
    mediaPlayer.addEventListener('play', () => {
        if (loopSegmentCheck.checked) {
            const startTime = parseFloat(startTimeInput.value) || 0;
            if (mediaPlayer.currentTime < startTime) {
                mediaPlayer.currentTime = startTime;
            }
        }
    });
</script>

</body>
</html>
