<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Media Player</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: #2d2d2d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        video, audio {
            width: 100%;
            max-height: 400px;
            background-color: #000;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            align-items: center;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .delete-btn {
            background-color: #dc3545;
            padding: 4px 8px;
            font-size: 0.8em;
            margin-left: 10px;
        }
        .delete-btn:hover { background-color: #c82333; }
        input[type="file"] { margin-bottom: 15px; }
        
        /* New styling for the speaker selector */
        .device-selector {
            background-color: #3d3d3d;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select {
            background-color: #2d2d2d;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 3px;
        }

        .segment-controls {
            background-color: #3d3d3d;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            gap: 10px;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
        }
        .segment-controls input[type="number"] {
            width: 60px;
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #555;
            background: #2d2d2d;
            color: white;
        }
        .playlist-container { margin-top: 20px; }
        .playlist {
            list-style: none;
            padding: 0;
            max-height: 250px;
            overflow-y: auto;
            background: #3d3d3d;
            border-radius: 5px;
        }
        .playlist li {
            padding: 10px;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .playlist li:hover { background-color: #4d4d4d; }
        .playlist li.active { background-color: #007bff; font-weight: bold; }
        .track-info {
            cursor: pointer;
            flex-grow: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .note { font-size: 0.85em; color: #aaa; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Offline Media Player</h2>
    <p class="note">Files uploaded here are saved directly to your browser's local database. They will still be here if you refresh the page or close the tab.</p>
    
    <input type="file" id="fileInput" multiple accept="video/*, audio/*">
    <span id="loadingMsg" style="display:none; color: #007bff; font-size: 0.9em;">Saving to database...</span>
    
    <div class="device-selector">
        <strong>Speaker:</strong>
        <select id="speakerSelect">
            <option value="">Default Speaker</option>
        </select>
        <button id="loadSpeakersBtn" style="padding: 4px 8px; font-size: 0.8em;">Load Devices</button>
    </div>

    <video id="mediaPlayer" controls playsinline>
        Your browser does not support the video tag.
    </video>

    <div class="controls">
        <button id="prevBtn" disabled>⏮ Previous</button>
        <button id="nextBtn" disabled>⏭ Next</button>
        <label>
            <input type="checkbox" id="autoplayCheck" checked> Autoplay Next
        </label>
    </div>

    <div class="segment-controls">
        <strong>Segment:</strong>
        <label>Start (s): <input type="number" id="startTime" min="0" step="1"></label>
        <label>End (s): <input type="number" id="endTime" min="0" step="1"></label>
        <label><input type="checkbox" id="loopSegmentCheck"> Loop</label>
    </div>

    <div class="playlist-container">
        <h3>Saved Playlist</h3>
        <ul class="playlist" id="playlist"></ul>
    </div>
</div>

<script>
    // --- Audio Routing Logic ---
    const speakerSelect = document.getElementById('speakerSelect');
    const loadSpeakersBtn = document.getElementById('loadSpeakersBtn');
    const mediaPlayer = document.getElementById('mediaPlayer');

    // Load available audio output devices
    async function loadAudioDevices() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
            alert("Your browser does not support checking audio devices.");
            return;
        }

        try {
            // Browsers require permission to see device names, so we briefly request audio access
            await navigator.mediaDevices.getUserMedia({ audio: true });
            
            const devices = await navigator.mediaDevices.enumerateDevices();
            const audioOutputs = devices.filter(device => device.kind === 'audiooutput');
            
            speakerSelect.innerHTML = ''; // Clear old list
            
            if (audioOutputs.length === 0) {
                const option = document.createElement('option');
                option.text = "No speakers found";
                speakerSelect.appendChild(option);
                return;
            }

            audioOutputs.forEach(device => {
                const option = document.createElement('option');
                option.value = device.deviceId;
                option.text = device.label || `Speaker ${speakerSelect.length + 1}`;
                speakerSelect.appendChild(option);
            });
            
            loadSpeakersBtn.style.display = 'none'; // Hide button once loaded

        } catch (err) {
            console.error("Error accessing audio devices:", err);
            alert("Please allow microphone permissions so the browser can see your speaker names.");
        }
    }

    // Change the output when you pick a new dropdown item
    speakerSelect.addEventListener('change', async (e) => {
        const deviceId = e.target.value;
        if (typeof mediaPlayer.setSinkId === 'function') {
            try {
                await mediaPlayer.setSinkId(deviceId);
            } catch (error) {
                console.error('Error routing audio:', error);
                alert("Failed to change speaker.");
            }
        } else {
            alert('Your browser does not support routing audio to specific speakers.');
        }
    });

    loadSpeakersBtn.addEventListener('click', loadAudioDevices);

    // --- Database Setup (IndexedDB) ---
    let db;
    const dbName = "MediaStorage";
    const storeName = "files";
    
    const request = indexedDB.open(dbName, 1);
    
    request.onupgradeneeded = (e) => {
        db = e.target.result;
        if (!db.objectStoreNames.contains(storeName)) {
            db.createObjectStore(storeName, { keyPath: "id", autoIncrement: true });
        }
    };
    
    request.onsuccess = (e) => {
        db = e.target.result;
        loadPlaylistFromDB(); 
    };

    // --- Media Player Logic ---
    const fileInput = document.getElementById('fileInput');
    const loadingMsg = document.getElementById('loadingMsg');
    const playlistEl = document.getElementById('playlist');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const autoplayCheck = document.getElementById('autoplayCheck');
    const startTimeInput = document.getElementById('startTime');
    const endTimeInput = document.getElementById('endTime');
    const loopSegmentCheck = document.getElementById('loopSegmentCheck');

    let playlist = []; 
    let currentIndex = -1;
    let currentObjectURL = null; 

    fileInput.addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;

        loadingMsg.style.display = 'inline';
        
        for (const file of files) {
            await saveFileToDB(file);
        }
        
        loadingMsg.style.display = 'none';
        fileInput.value = ''; 
        loadPlaylistFromDB(true); 
    });

    function saveFileToDB(file) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction([storeName], "readwrite");
            const store = transaction.objectStore(storeName);
            const record = { name: file.name, type: file.type, data: file };
            
            const request = store.add(record);
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    function loadPlaylistFromDB(playLatest = false) {
        const transaction = db.transaction([storeName], "readonly");
        const store = transaction.objectStore(storeName);
        const req = store.getAll();

        req.onsuccess = (e) => {
            playlist = e.target.result;
            renderPlaylist();
            
            if (playlist.length > 0) {
                if (playLatest) {
                    loadMedia(playlist.length - 1);
                } else if (currentIndex === -1) {
                    updateButtons();
                }
            } else {
                mediaPlayer.src = "";
                currentIndex = -1;
                updateButtons();
            }
        };
    }

    function deleteFile(id, index) {
        const transaction = db.transaction([storeName], "readwrite");
        const store = transaction.objectStore(storeName);
        store.delete(id);
        
        transaction.oncomplete = () => {
            if (index === currentIndex) {
                mediaPlayer.src = "";
                currentIndex = -1;
            } else if (index < currentIndex) {
                currentIndex--; 
            }
            loadPlaylistFromDB();
        };
    }

    function renderPlaylist() {
        playlistEl.innerHTML = '';
        playlist.forEach((item, index) => {
            const li = document.createElement('li');
            if (index === currentIndex) li.classList.add('active');
            
            const trackInfo = document.createElement('div');
            trackInfo.className = 'track-info';
            trackInfo.textContent = item.name;
            trackInfo.addEventListener('click', () => loadMedia(index));

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.textContent = '✖';
            deleteBtn.addEventListener('click', (e) => {
                e.stopPropagation(); 
                deleteFile(item.id, index);
            });

            li.appendChild(trackInfo);
            li.appendChild(deleteBtn);
            playlistEl.appendChild(li);
        });
    }

    function loadMedia(index) {
        if (index < 0 || index >= playlist.length) return;
        currentIndex = index;
        const item = playlist[index];
        
        if (currentObjectURL) {
            URL.revokeObjectURL(currentObjectURL);
        }
        
        currentObjectURL = URL.createObjectURL(item.data);
        mediaPlayer.src = currentObjectURL;
        
        // Ensure the current speaker is maintained when a new track loads
        if (typeof mediaPlayer.setSinkId === 'function' && speakerSelect.value) {
            mediaPlayer.setSinkId(speakerSelect.value).catch(e => console.error(e));
        }
        
        mediaPlayer.play();
        
        startTimeInput.value = '';
        endTimeInput.value = '';
        loopSegmentCheck.checked = false;

        renderPlaylist();
        updateButtons();
    }

    function updateButtons() {
        prevBtn.disabled = currentIndex <= 0;
        nextBtn.disabled = currentIndex >= playlist.length - 1;
    }

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) loadMedia(currentIndex - 1);
    });

    nextBtn.addEventListener('click', () => {
        if (currentIndex < playlist.length - 1) loadMedia(currentIndex + 1);
    });

    mediaPlayer.addEventListener('ended', () => {
        if (autoplayCheck.checked && currentIndex < playlist.length - 1) {
            loadMedia(currentIndex + 1);
        }
    });

    mediaPlayer.addEventListener('timeupdate', () => {
        if (!loopSegmentCheck.checked) return;
        const startTime = parseFloat(startTimeInput.value) || 0;
        const endTime = parseFloat(endTimeInput.value) || mediaPlayer.duration;

        if (mediaPlayer.currentTime >= endTime && endTime > startTime) {
            mediaPlayer.currentTime = startTime;
            mediaPlayer.play();
        }
    });

    mediaPlayer.addEventListener('play', () => {
        if (loopSegmentCheck.checked) {
            const startTime = parseFloat(startTimeInput.value) || 0;
            if (mediaPlayer.currentTime < startTime) {
                mediaPlayer.currentTime = startTime;
            }
        }
    });
</script>

</body>
</html>
