<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ducklord6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div class="text-center p-8 bg-white rounded-2xl shadow-sm border border-gray-100 w-full max-w-sm">
        <div class="flex flex-col gap-4">
            <!-- The Textbox (marked as readonly) -->
            <input 
                type="text" 
                id="myTextbox" 
                readonly
                class="w-full px-4 py-2 border border-gray-200 bg-gray-50 rounded-lg text-gray-600 cursor-default outline-none transition-all"
            >

            <!-- The Button -->
            <button 
                onclick="handleNavigation()"
                id="mainButton"
                class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition-all transform active:scale-95 shadow-md"
            >
                Click Me
            </button>
        </div>
    </div>

    <script>
        /* MANUAL EDITING SECTION
           Change the values inside the quotes below to update your page!
        */
        
        const BUTTON_TEXT = "CLICK TO PLAY MY GAME PLEASE"; 
        const DESTINATION_URL = "ducklord6.github.io/dots.html";
        const TEXTBOX_CONTENT = "PLEASE PLEASE PLEASE PLAY MY GAME"; // Edit this in code to change what the box says

        /* --------------------------------------------------------- */

        // This runs automatically when the page loads
        window.onload = function() {
            document.getElementById('mainButton').textContent = BUTTON_TEXT;
            document.getElementById('myTextbox').value = TEXTBOX_CONTENT;
        };

        // This handles the click
        function handleNavigation() {
            window.open(DESTINATION_URL, '_blank');
        }
    </script>
</body>
</html>
