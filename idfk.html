<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File to QR Video Exporter</title>
    <!-- Include QR Code generation library -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { margin: 10px 0; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 4px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; }
        button.primary { background-color: #2563eb; color: white; border: none; }
        button.primary:hover { background-color: #1d4ed8; }
        #qrcode { display: flex; justify-content: center; margin-top: 20px; min-height: 256px; background: #fff; padding: 10px; border: 1px dashed #bbb; }
        #status { font-weight: bold; margin-top: 10px; color: #2563eb; }
    </style>
</head>
<body>

<div class="container">
    <h2>File to QR Video Streamer</h2>
    <p>Select a small file, then click below to render and record it into a video file.</p>
    <input type="file" id="fileInput">
    <button class="primary" onclick="generateAndRecordVideo()">Record & Download QR Video</button>
    <div id="status">Ready</div>
    <div id="qrcode"></div>
</div>

<script>
    // Initialize the QR generator library immediately on page load
    const qrContainer = document.getElementById("qrcode");
    const statusText = document.getElementById("status");
    
    const qrGenerator = new QRCode(qrContainer, {
        text: "INITIALIZING",
        width: 256,
        height: 256,
        correctLevel: QRCode.CorrectLevel.L
    });

    function generateAndRecordVideo() {
        const fileInput = document.getElementById("fileInput");
        if (fileInput.files.length === 0) {
            alert("Please select a file first!");
            return;
        }

        // FIX: Select the single file object from the file array list
        const file = fileInput.files[0];
        const reader = new FileReader();

        reader.onload = async function(e) {
            statusText.innerText = "Processing file binary...";
            const arrayBuffer = e.target.result;
            
            // Convert file data to Base64 string chunking
            const base64Data = btoa(String.fromCharCode(...new Uint8Array(arrayBuffer)));
            const chunkSize = 150; 
            const totalFrames = Math.ceil(base64Data.length / chunkSize);
            
            statusText.innerText = `Preparing recording for ${totalFrames} frames...`;

            // Identify the canvas element generated inside the container
            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) {
                statusText.innerText = "Error: Canvas element not ready.";
                return;
            }

            // Capture canvas frames at 10 frames per second
            const stream = canvas.captureStream(10);
            const recordedChunks = [];
            
            // Fallback checking for browser support
            let options = { mimeType: 'video/webm; codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' };
            }
            
            const mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `${file.name}_qr_stream.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                statusText.innerText = "Download Complete!";
            };

            mediaRecorder.start();

            let currentFrame = 0;
            const intervalId = setInterval(() => {
                if (currentFrame >= totalFrames) {
                    clearInterval(intervalId);
                    mediaRecorder.stop();
                    return;
                }

                const start = currentFrame * chunkSize;
                const end = Math.min(start + chunkSize, base64Data.length);
                const chunk = base64Data.slice(start, end);

                // Format metadata packet: index/total|payload
                const payload = `${currentFrame}/${totalFrames}|${chunk}`;
                qrGenerator.makeCode(payload);

                // FIX: Added missing string variable template bracket ($)
                statusText.innerText = `Recording frame ${currentFrame + 1} of ${totalFrames}...`;
                currentFrame++;
            }, 100); 
        };

        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
