<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Speed QR Video Exporter</title>
    <!-- QR Code generation library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- QR Code reading library -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; }
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, button { margin: 10px 0; padding: 12px; width: 100%; box-sizing: border-box; border-radius: 4px; font-weight: bold; border: 1px solid #ccc; cursor: pointer; }
        button.primary { background-color: #2563eb; color: white; border: none; }
        button.primary:hover { background-color: #1d4ed8; }
        button.secondary { background-color: #10b981; color: white; border: none; }
        button.secondary:hover { background-color: #059669; }
        #qrcode { display: flex; justify-content: center; margin-top: 20px; min-height: 400px; background: #fff; padding: 10px; border: 1px dashed #bbb; }
        .status { font-weight: bold; margin-top: 10px; color: #2563eb; }
    </style>
</head>
<body>

<!-- ENCODER SECTION -->
<div class="container">
    <h2>1. High-Speed Encoder</h2>
    <input type="file" id="fileInput">
    <button class="primary" onclick="generateAndRecordVideo()">Record 30FPS QR Video</button>
    <div id="encode-status" class="status">Ready</div>
    <!-- Increased size to hold denser data chunks -->
    <div id="qrcode"></div>
</div>

<!-- DECODER SECTION -->
<div class="container">
    <h2>2. High-Speed Decoder</h2>
    <input type="file" id="videoInput" accept="video/*">
    <button class="secondary" onclick="decodeVideo()">Scan Video & Restore File</button>
    <div id="decode-status" class="status">Ready</div>
</div>

<script>
    /* =========================================
       ENCODER LOGIC (File -> Video)
       ========================================= */
    const qrContainer = document.getElementById("qrcode");
    const encodeStatus = document.getElementById("encode-status");
    
    // Increased resolution to support larger chunks
    const qrGenerator = new QRCode(qrContainer, {
        text: "INITIALIZING",
        width: 400,
        height: 400,
        correctLevel: QRCode.CorrectLevel.L
    });

    function generateAndRecordVideo() {
        const fileInput = document.getElementById("fileInput");
        if (fileInput.files.length === 0) {
            alert("Please select a file first!");
            return;
        }

        const file = fileInput.files[0];
        const reader = new FileReader();

        // SPEED OPTIMIZATION: Read directly as Data URL to use browser's native C++ Base64 engine
        reader.onload = async function(e) {
            encodeStatus.innerText = "Processing file binary...";
            
            // Extract the base64 string from the Data URL (strips the 'data:image/png;base64,' part)
            const base64Data = e.target.result.split(',')[1];
            
            // SPEED OPTIMIZATION: 800 chars per frame instead of 150
            const chunkSize = 800; 
            const totalFrames = Math.ceil(base64Data.length / chunkSize);
            
            encodeStatus.innerText = `Preparing recording for ${totalFrames} frames...`;

            const canvas = qrContainer.querySelector('canvas');
            if (!canvas) return;

            // SPEED OPTIMIZATION: Capture at 30 FPS
            const stream = canvas.captureStream(30);
            const recordedChunks = [];
            
            let options = { mimeType: 'video/webm; codecs=vp9' };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/webm' };
            }
            
            const mediaRecorder = new MediaRecorder(stream, options);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `${file.name}_qr_stream.webm`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                
                encodeStatus.innerText = "Download Complete!";
            };

            mediaRecorder.start();

            let currentFrame = 0;
            // SPEED OPTIMIZATION: Generate frames every ~33ms (30 FPS)
            const intervalId = setInterval(() => {
                if (currentFrame >= totalFrames) {
                    clearInterval(intervalId);
                    // Give a tiny buffer at the end so the last frame isn't cut off
                    setTimeout(() => mediaRecorder.stop(), 200);
                    return;
                }

                const start = currentFrame * chunkSize;
                const end = Math.min(start + chunkSize, base64Data.length);
                const chunk = base64Data.slice(start, end);

                const payload = `${currentFrame}/${totalFrames}|${chunk}`;
                qrGenerator.makeCode(payload);

                encodeStatus.innerText = `Recording frame ${currentFrame + 1} of ${totalFrames}...`;
                currentFrame++;
            }, 33); 
        };

        // Triggers the blazing fast native base64 conversion
        reader.readAsDataURL(file);
    }

    /* =========================================
       DECODER LOGIC (Video -> File)
       ========================================= */
    const decodeStatus = document.getElementById("decode-status");

    function decodeVideo() {
        const videoInput = document.getElementById("videoInput");
        if (videoInput.files.length === 0) {
            alert("Please select a video file first!");
            return;
        }

        decodeStatus.innerText = "Loading video...";
        const videoFile = videoInput.files[0];
        
        const video = document.createElement('video');
        video.src = URL.createObjectURL(videoFile);
        video.muted = true;
        // SPEED OPTIMIZATION: Play video slightly faster to speed up scanning
        video.playbackRate = 1.5; 
        
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        let chunks = {}; 
        let totalFramesExpected = null;
        let isDone = false;

        video.addEventListener('play', () => {
            decodeStatus.innerText = "Scanning frames...";
            
            const scanFrame = () => {
                if (isDone || video.paused || video.ended) return;
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    const parts = code.data.split('|');
                    if (parts.length === 2) {
                        const headerParts = parts[0].split('/');
                        if (headerParts.length === 2) {
                            const current = parseInt(headerParts[0]);
                            const total = parseInt(headerParts[1]);
                            
                            if (!chunks[current]) {
                                chunks[current] = parts[1];
                                totalFramesExpected = total;
                                decodeStatus.innerText = `Scanned ${Object.keys(chunks).length} of ${totalFramesExpected} frames...`;
                            }

                            if (Object.keys(chunks).length === totalFramesExpected) {
                                isDone = true;
                                video.pause();
                                reassembleAndDownload(chunks, totalFramesExpected);
                                return;
                            }
                        }
                    }
                }
                
                requestAnimationFrame(scanFrame);
            };
            
            requestAnimationFrame(scanFrame);
        });

        video.play();
    }

    function reassembleAndDownload(chunks, totalFrames) {
        decodeStatus.innerText = "Reassembling high-speed base64 data...";
        let fullBase64 = '';
        
        for (let i = 0; i < totalFrames; i++) {
            fullBase64 += chunks[i];
        }

        try {
            const byteCharacters = atob(fullBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            
            const blob = new Blob([byteArray], {type: "application/octet-stream"});
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "restored_file"; 
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            decodeStatus.innerText = "File restored successfully! (Add correct file extension like .png to the downloaded file)";
        } catch (e) {
            decodeStatus.innerText = "Error rebuilding file: " + e.message;
        }
    }
</script>

</body>
</html>
