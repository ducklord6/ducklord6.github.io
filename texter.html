<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Continuous Keyboard Shifter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background-color: #121212;
            color: #ffffff;
        }
        textarea {
            width: 100%;
            height: 100px;
            margin: 10px 0;
            padding: 10px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin: 15px 0;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            flex: 1;
        }
        button:hover {
            background-color: #4752C4;
        }
        button.secondary {
            background-color: #4f545c;
        }
        button.secondary:hover {
            background-color: #686d73;
        }
        input[type="number"] {
            width: 60px;
            padding: 8px;
            background-color: #222;
            color: #fff;
            border: 1px solid #444;
            border-radius: 4px;
            font-size: 16px;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }
        .gap-label {
            margin-top: 0;
            display: inline;
        }
    </style>
</head>
<body>

    <h2>Keyboard Character Shifter</h2>
    
    <div class="controls">
        <label class="gap-label" for="gapInput">Shift Gap (Keys to the right):</label>
        <input type="number" id="gapInput" value="1" min="1" max="25">
    </div>

    <label for="input">Input Text:</label>
    <textarea id="input" placeholder="Type or paste normal text here..."></textarea>
    
    <div class="btn-group">
        <button class="secondary" onclick="pasteToInput()">Paste into Input</button>
    </div>
    
    <label for="output">Shifted Output:</label>
    <textarea id="output" placeholder="Shifted text will appear here..." readonly></textarea>
    
    <div class="btn-group">
        <button onclick="copyOutput()">Copy Output</button>
    </div>

    <script>
        // All 26 letters linked in a continuous layout stream (p loops to a, l loops to z, m loops back to q)
        const alphabetChain = [
            'q','w','e','r','t','y','u','i','o','p', // Top row
            'a','s','d','f','g','h','j','k','l',     // Middle row
            'z','x','c','v','b','n','m'              // Bottom row
        ];

        const inputTextArea = document.getElementById('input');
        const outputTextArea = document.getElementById('output');
        const gapInput = document.getElementById('gapInput');

        function shiftChar(char, gap) {
            const isUpper = char === char.toUpperCase() && char !== char.toLowerCase();
            const lowerChar = char.toLowerCase();

            const index = alphabetChain.indexOf(lowerChar);
            if (index !== -1) {
                // Loops cleanly across the entire 26-character chain based on chosen gap value
                const newIndex = (index + gap) % alphabetChain.length;
                const shifted = alphabetChain[newIndex];
                return isUpper ? shifted.toUpperCase() : shifted;
            }
            return char; // Keeps spaces, numbers, and symbols exactly as they are
        }

        function processText() {
            const rawText = inputTextArea.value;
            const gap = parseInt(gapInput.value, 10) || 1;
            
            outputTextArea.value = rawText
                .split('')
                .map(char => shiftChar(char, gap))
                .join('');
        }

        inputTextArea.addEventListener('input', processText);
        gapInput.addEventListener('input', processText);

        async function pasteToInput() {
            try {
                const text = await navigator.clipboard.readText();
                inputTextArea.value = text;
                processText();
            } catch (err) {
                console.error('Failed to read clipboard:', err);
            }
        }

        async function copyOutput() {
            try {
                await navigator.clipboard.writeText(outputTextArea.value);
            } catch (err) {
                console.error('Failed to copy text:', err);
            }
        }
    </script>

</body>
</html>
